# 开发环境配置。全部写成 ${环境变量:默认值}，想覆盖任何一项都不用改这个文件。
#
# 本机两条可选的依赖路径，默认走 A：
#   A 本机已装的 MySQL80 + E:\redis    MySQL localhost:3306 库 chargeops  Redis localhost:6379 db 1
#   B docker compose（项目根目录）      MySQL localhost:13306 库 chargeops Redis localhost:16379 db 0
#   切到 B：CHARGE_OPS_DB_PORT=13306 CHARGE_OPS_REDIS_PORT=16379 CHARGE_OPS_REDIS_DB=0 mvn spring-boot:run
#
# 两条路径下隔开两个项目的都是库名和 Redis 库号，不是端口：本机上另一个项目也用 3306/6379。
# 端口错开而库名一样时会「往另一个项目的表里插数据」，且连接是成功的、没有任何报错。

spring:
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver

      # 连接串里几个不能少的东西：useUnicode + characterEncoding=utf8 保证中文参数不乱码；
      # allowPublicKeyRetrieval 是 MySQL 8 的 caching_sha2_password 在非 SSL 连接下必需的；
      # rewriteBatchedStatements 把批量 insert 改写成一条多值 insert（遥测批量入库差一个数量级）。
      #
      # connectionTimeZone 必须写 +08:00 而不是 Asia/Shanghai：写时区名字会启动直接失败
      # （Unknown or incorrect time zone）—— MySQL 的命名时区要查 mysql.time_zone_name
      # 那几张表，而它们默认是空的；数字偏移不查任何表，中国不实行夏令时，两者等价。
      #
      # 光有它只影响驱动层的读写转换，数据库端的 CURRENT_TIMESTAMP 还走会话时区，要靠
      # forceConnectionTimeZoneToSession 发 SET time_zone='+08:00'；缺了它，数据库自动填的
      # create_time 会比 Java 填的业务时间差 8 小时。
      url: jdbc:mysql://${CHARGE_OPS_DB_HOST:localhost}:${CHARGE_OPS_DB_PORT:3306}/${CHARGE_OPS_DB_NAME:chargeops}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true

      username: ${CHARGE_OPS_DB_USERNAME:root}
      password: ${CHARGE_OPS_DB_PASSWORD:123456}

      # 开发环境的规模（单机、一个人用）。生产要按「max_connections ÷ 实例数」反推，
      # 见 application-prod.yml
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

      # 三个保活参数必须配套：少了会出现「连接被数据库单方面断开、池子里还以为是好的」，
      # 症状是请求时报 Communications link failure，而重启应用就好了
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000

      # Druid 监控页 http://localhost:8081/druid/，只在 dev 开：它会完整显示执行过的 SQL 和
      # 参数（含密码、手机号这些明文值），自带的那层登录只是一个写死在配置里的弱口令。
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
        # 关掉「重置统计数据」按钮，否则手滑点一下之前的慢查询数据就没了
        reset-enable: false

      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000

  data:
    redis:
      host: ${CHARGE_OPS_REDIS_HOST:localhost}
      port: ${CHARGE_OPS_REDIS_PORT:6379}
      # 库号 1，不是 0：Redis 没有「库名」的概念，库号是唯一能把新老项目隔开的手段。
      # 两边都用 `chat:session:` 这个 key 前缀，共用 db 0 会互相覆盖会话数据，
      # 症状是「聊了两句，上下文突然串到另一个人去了」
      database: ${CHARGE_OPS_REDIS_DB:1}
      # 本机 Redis（E:\redis）设了 requirepass，不填密码会 NOAUTH。本机没设的话注释掉
      password: ${CHARGE_OPS_REDIS_PASSWORD:123456}
      # 不设的话默认是无限等待，Redis 挂掉时请求会一直挂着，而不是快速失败
      timeout: 3000ms

      lettuce:
        pool:
          # 没有 commons-pool2 依赖的话下面几行是静默失效的（lettuce 只用一个共享连接，
          # 不报任何错）。pom 里已经引了
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  # 这里没有 ai 块：模型跑在本机 Ollama 上，没有密钥要配。
  # 端口和模型名在 application.yml，要换机器或换模型设 CHARGE_OPS_OLLAMA_* 环境变量即可。

# dev 专属，所以这里可以出现任何生产不能有的东西（判断标准只有一个：它在生产环境也成立吗）
management:
  endpoint:
    health:
      # 一眼能看出「是数据库没起来还是代码有问题」，比翻启动日志快。生产是默认的 never
      show-details: always

# 打印 SQL 用 logging.level.<Mapper 接口所在的包>=debug —— MyBatis 把日志打到「Mapper 接口的
# 全限定名」这个 logger 上。代价是参数值也会被完整打印（包括密码），所以只能在 dev 存在。
logging:
  level:
    # 精确到 mapper 包，不用 com.chargeops=debug 全开 —— 全开的话框架内部的日志会把 SQL 淹掉
    com.chargeops.mapper: debug

    # 上面那行只对 mapper 包生效；拦截器有没有放行、BaseContext 是不是 null、结算任务扫到
    # 几条，这些日志都落在别的包下，没有这一行会被 root:info 挡掉，像是「代码没走到那里」
    com.chargeops: debug

# 开关放这里而不是 application.yml：「这个环境跑不跑后台任务」是环境属性。
# 值必须显式为 true（@ConditionalOnProperty 没有 matchIfMissing）：漏配不会报错，只是任务静默不跑
chargeops:
  scheduling:
    enabled: true

  ai-ops:
    vector-store:
      # 和 MySQL 的端口规则一样：15432 避开本机可能已有的 5432，见 docker-compose.yml
      url: ${CHARGE_OPS_PG_URL:jdbc:postgresql://localhost:15432/chargeops_vector}
      username: ${CHARGE_OPS_PG_USERNAME:postgres}
      # 开发用默认值，和上面 MySQL、Redis 一样：本机容器里的密码就是它。
      # 生产没有默认值，见 application-prod.yml
      password: ${CHARGE_OPS_PG_PASSWORD:123456}
