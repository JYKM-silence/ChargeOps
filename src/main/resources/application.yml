# ChargeOps 通用配置：只放「应用怎么跑」，连接信息在 application-dev.yml / application-prod.yml

server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      # 不加的话某些客户端发来的中文参数会乱码，而且只在特定工具里复现
      force: true

spring:
  application:
    name: chargeops

  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # baseline-on-migrate：给「表都在、但没有 flyway_schema_history」的老库补一条 BASELINE 记录，
  # 只执行版本号更大的迁移（老库跳 V1 跑 V2），而不是直接拒绝启动。
  # 它是「相信」不是「校验」，老库的漂移不会被发现，引入迁移时要手工比对一次。
  # 这几行是 spring 的 flyway 键：写成 `spring.flyway:` 整块配置一条都不生效，且不会有任何警告。
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration

  # Boot 默认的 ThreadPoolTaskScheduler 只有一个线程，四个定时任务会互相排队，
  # 症状是「某个任务偶尔没跑」。见 ChargeOpsApplication。
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: chargeops-sched-

  # 超时写在配置里而不是 @Bean 里：Spring AI 用的是 Boot 自动配置的那个
  # RestClient.Builder，容器里这几个键对它同样生效，为此写一个 Java 配置类是多余的。
  #
  # read-timeout 默认的 30s 不够：一次带工具调用的问答要等模型多轮往返。
  # 超时抛的是 ResourceAccessException，前端看到「AI 响应超时」，用户会重试，也就是白等两次。
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 60s

  ai:
    # 供应商是 Ollama，装在本机。这里没有「把用不到的自动配置关掉」那一串，
    # 因为 Ollama 不需要密钥，没有「密钥为空但 bean 照样建」这个问题。
    #
    # 换回云 API 时那一串是必须的：那些自动配置类的默认值是「装配」而不是「不装配」
    # （matchIfMissing = true），密钥为空时它们照样去建 bean，在建的过程中 Assert 失败，
    # 把应用和 mvn test 一起带崩。实测漏关一个，382 个测试里 282 个报上下文加载失败。
    model:
      chat: ollama
      embedding: ollama

    ollama:
      base-url: ${CHARGE_OPS_OLLAMA_URL:http://localhost:11434}

      chat:
        # qwen3 是目前本地模型里工具调用最稳的一档。8G 显存放得下 8b 的量化版，
        # 显存更大可以换 qwen3:14b，代码一行不用改。
        model: ${CHARGE_OPS_OLLAMA_CHAT_MODEL:qwen3:8b}

        # 关掉思维链。qwen3 默认先输出一段 reasoning 再给答案，那对调试有用，
        # 但会把响应时间成倍拉长，而且每一轮工具调用都要重新生成一遍。
        think: false

        # 低温度：答案要以检索到的文档片段和工具返回的真实数据为准，不需要模型发挥。
        # 调高会让它在没有依据时也把话说圆。
        temperature: 0.0

      embedding:
        # 1024 维，必须和 AiOpsProperties 里的 dimensions 一致。
        # 换向量模型要重建索引：不同模型的向量空间不可比，混用会检索出完全不相关的东西
        model: ${CHARGE_OPS_OLLAMA_EMBEDDING_MODEL:bge-m3}

mybatis:
  # XML 在 resources/mapper 下，和 Mapper 接口的包路径不一致，所以必须在这里声明位置
  mapper-locations: classpath:mapper/*.xml

  # 让 XML 里的 resultType 可以直接写 Staff
  type-aliases-package: com.chargeops.entity

  configuration:
    # 不开的话 snake_case 列名映射不到 camelCase 属性，字段全是 null 且不报错
    map-underscore-to-camel-case: true

    # NULL 值也调用 setter。Map 类型的返回值需要，实体类其实不需要
    call-setters-on-nulls: true

pagehelper:
  # 显式声明方言，省掉第一次分页时读数据库元信息的开销
  helper-dialect: mysql

  # 页码越界时修正：页码 > 总页数就返回最后一页。
  # 代价是「请求第 999 页会返回最后几行」，调用方分不清「这就是最后一页」和「你要的那页没有」；
  # 开着是因为后台列表删数据后容易页码越界，返回空列表会让用户以为数据都没了
  reasonable: true

  # 把 pageNum/pageSize 当方法参数直接传给 Mapper，不用 startPage()。本项目不用。
  support-methods-arguments: false

  params:
    pageNum: pageNum
    pageSize: pageSize

chargeops:
  jwt:
    # 密钥 UTF-8 编码后必须 ≥ 32 字节（HS256 的要求，jjwt 0.12 起不够就抛 WeakKeyException）——
    # 症状是应用能正常启动、数据库 Redis 都连得上，只有调登录接口那一刻 500。
    # 两把密钥不能共用：共用的话车主端小程序被逆向、密钥泄露就能签出 staffId=1 的 token 拿管理员权限。
    # 这两个是开发用假密钥；生产用没有默认值的环境变量，见 application-prod.yml
    admin-secret-key: chargeops-dev-admin-secret-key-not-for-production-use-2026
    # 2 小时。管理端是内部人员使用
    admin-ttl: 7200000
    admin-token-name: token

    member-secret-key: chargeops-dev-member-secret-key-not-for-production-use-2026
    # 7 天。车主端是小程序，用户不希望在充电站现场被要求重新登录
    member-ttl: 604800000
    # 车主端从哪个请求头取 token。名字本身无所谓，重要的是前端和后端必须一致 ——
    # 不一致的症状是「登录成功了，但下一个请求 401」，而两边都觉得自己是对的
    member-token-name: authentication

  storage:
    # local 是目前唯一实现了的选项；写不认识的值会启动失败，不会静默降级
    type: local

    # 相对路径按项目根目录锚定，不是 JVM 的工作目录（点 Run / mvn / java -jar 是三个目录，
    # 同一个配置指向三个地方，表现只是「图片打不开」）。见 LocalFileStorage
    local-dir: ./data/upload

    # 拼在返回 URL 前面的部分。这个值会被写进数据库（站点图片列存的是完整 URL），
    # 换域名/换端口时光改这里不够，历史数据里的旧 URL 也得一起刷
    url-prefix: http://localhost:8081

    # 同时被 LocalFileStorage（拼 URL）和 WebMvcConfiguration（注册静态资源映射）使用，必须一致。
    # 不要配成 /api 开头 —— 那个前缀被 JWT 拦截器盯着，图片会全部裂掉且日志里一条报错都没有
    url-path: /img

  scheduled:
    # 这里放「多久扫一次」这类业务参数；「这个环境跑不跑任务」的开关在
    # application-dev.yml / application-prod.yml
    #
    # 用 fixedDelay 而不是 cron：保证上一次跑完之后再等这么久，慢扫描不会和自己重叠
    pay-timeout-scan-ms: 300000

    # 决定用户有多久可以慢慢去充值。扫早了的后果不是提醒用户，而是把这笔订单打成 6 支付失败 ——
    # 6 仍然可以支付，但订单上会留下一次本不该有的失败记录
    pay-timeout-minutes: 15

    # 单次扫描最多处理多少笔，避免一次把几千笔待支付订单全捞进内存逐笔开事务
    pay-timeout-batch-size: 200

    # 权益过期落库（MemberPackageExpireJob）：把 status 还停在 1、但 expire_time 已过的改成 3。
    # 读路径本来就带 expire_time > now 兜底，它只是让运营统计和车主看到的灰态正确
    package-expire-scan-ms: 1800000

    # 这是一条 UPDATE ... LIMIT n，不占堆内存、占的是行锁和 undo log，取值可以远大于上面那个
    package-expire-batch-size: 5000

springdoc:
  swagger-ui:
    # http://localhost:8081/swagger-ui/index.html
    path: /swagger-ui.html
    # 按路径字母序排列，接口多了之后比「新加的排最后」更容易找到目标
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    # 纯 JSON，不依赖任何前端静态资源：验收时先访问它，能把「文档数据有问题」和
    # 「UI 静态资源有问题」分开
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        # 不要写 "*"：/actuator/env 会返回数据库密码、JWT 密钥，/actuator/heapdump 能下载整个堆
        include: health,info,metrics
  endpoint:
    health:
      # 默认值就是 never，所以这里什么都不写才是正确的生产形态。本文件环境无关：
      # show-details: always 写在这里等于生产环境也生效，/actuator/health 会吐出
      # 数据库版本、Redis 版本、磁盘路径。它开在 application-dev.yml 里。

# logging.level.com.chargeops 同理在 application-dev.yml，本文件不写。

logging:
  level:
    # 兜底级别，按包名开的级别都是在它之上做加法
    root: info
  pattern:
    # 默认格式没有线程名，而排查 BaseContext 没清理导致的串号必须能看到「同一个线程处理了两个请求」
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
