# 生产环境配置，生效方式 SPRING_PROFILES_ACTIVE=prod。
#
# 所有会变的东西都写成没有默认值的 ${...}：缺配置 = 启动直接失败，失败信息里写着缺哪个变量名。
# 写成 ${VAR:某个默认值} 的话，「忘了配生产密钥」不会让应用起不来，而是让它用一个可能在仓库里
# 公开可见的字符串去签发生产 token，且没有任何即时症状。
# 这个文件里没有的东西同样重要：没有 stat-view-servlet、没有 show-details: always、
# 没有 com.chargeops: debug，这三样都在 application-dev.yml 里。

server:
  # 由编排层决定，不写死
  port: ${CHARGE_OPS_SERVER_PORT}
  servlet:
    encoding:
      charset: UTF-8
      force: true
  # 部署在 Nginx / SLB / 网关后面时打开这一行，否则 request.getRemoteAddr() 拿到的是代理的 IP、
  # request.getScheme() 永远是 http。前面是 Nginx 这类标准反代用 native，是 Spring Cloud
  # Gateway 用 framework。反过来也有风险：没有代理时打开它，客户端就能伪造 X-Forwarded-For。
  # forward-headers-strategy: native

spring:
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver

      # 连接串和 dev 完全一致（参数逐个解释在 application-dev.yml 里），只是没有任何默认值。
      # connectionTimeZone=%2B08:00 在生产尤其不能省：容器里的 MySQL 默认走 UTC，少了它，
      # 数据库自动填的 create_time 会比 Java 填的业务时间差 8 小时。
      # （%2B 是 + 的 URL 编码，直接写 + 会被解析成空格）
      url: jdbc:mysql://${CHARGE_OPS_DB_HOST}:${CHARGE_OPS_DB_PORT}/${CHARGE_OPS_DB_NAME}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      username: ${CHARGE_OPS_DB_USERNAME}
      password: ${CHARGE_OPS_DB_PASSWORD}

      # 这几个数不是调优参数，是要和数据库容量对齐的预算：max-active × 实例数
      # ≤ 数据库 max_connections - 预留。按 (20 × 10) 配的话平时正常，扩容到第 8 个实例之后
      # 开始随机报 Too many connections —— 扩容反而让服务变得不稳定。
      # 下面三个是占位值，部署前必须按这个公式重算。
      initial-size: ${CHARGE_OPS_DB_POOL_INITIAL:10}
      min-idle: ${CHARGE_OPS_DB_POOL_MIN_IDLE:10}
      max-active: ${CHARGE_OPS_DB_POOL_MAX_ACTIVE:30}
      # 不要设成 -1（无限等待）：那会让请求堆积而不是快速失败，表现是「线程池被占满 →
      # 整个应用不响应任何请求」，连 /actuator/health 也挂，于是容器被反复重启，
      # 而真正的原因（某条慢 SQL 占满连接池）在重启后消失了
      max-wait: 3000

      # 空闲连接保活。生产比开发更容易踩：中间隔着防火墙 / SLB，它们通常会静默掐掉
      # 空闲超过若干分钟的长连接。time-between-eviction-runs-millis 必须小于那个时长。
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000

      # 这里刻意没有 stat-view-servlet：Druid 监控页会完整展示执行过的 SQL 连同参数
      # （包括手机号、密码、金额），而它自带的那层登录只是一个写在配置文件里的弱口令。
      # 不写这一段 = 不启用，所以「缺失」才是正确形态；生产要监控慢 SQL 用下面的 stat filter。
      filter:
        stat:
          enabled: true
          # 只打超过阈值的 SQL，不会把日志淹掉，Druid 对参数做了截断
          log-slow-sql: true
          # 充电业务的接口都是「少表、走索引」的形状，超过 1 秒基本可以确定有问题（锁等待或索引没走到）
          slow-sql-millis: 1000

  data:
    redis:
      host: ${CHARGE_OPS_REDIS_HOST}
      port: ${CHARGE_OPS_REDIS_PORT}
      # 库号必须显式给，不要依赖默认的 0：生产环境和别的应用共用 Redis 实例时，
      # 库号是唯一的隔离手段（Redis 没有「库名」的概念），共用 db 0 的后果是两边的 key
      # 互相覆盖 —— 连接全部成功、没有任何报错，只有数据不对劲
      database: ${CHARGE_OPS_REDIS_DB}
      password: ${CHARGE_OPS_REDIS_PASSWORD}
      # 快速失败，不要在 Redis 挂掉时挂在那里占着 Tomcat 线程
      timeout: 3000ms
      lettuce:
        pool:
          max-active: ${CHARGE_OPS_REDIS_POOL_MAX_ACTIVE:32}
          max-idle: 16
          min-idle: 4
          max-wait: 3000ms

chargeops:
  jwt:
    # 两把密钥都必须由环境变量提供，且长度 UTF-8 编码后 ≥ 32 字节（HS256 的要求，
    # 见 application.yml 里那段说明和 JwtUtil 的显式校验）。生成方式：openssl rand -base64 48。
    # 两把还不能相同：共用的话车主端小程序一旦被逆向，攻击者就能签出 staffId=1 的 token 拿管理员权限。
    admin-secret-key: ${CHARGE_OPS_JWT_ADMIN_SECRET}
    member-secret-key: ${CHARGE_OPS_JWT_MEMBER_SECRET}

    # 管理端 2 小时（内部人员使用，会话短一点更安全）
    admin-ttl: ${CHARGE_OPS_JWT_ADMIN_TTL:7200000}
    # 车主端 7 天（小程序，用户不希望在充电站现场被要求重新登录）。
    # 代价是 JWT 无状态、服务端不保存会话，「禁用账号」在 token 过期前不会自动生效 ——
    # 缓解手段是钱包和订单端点在 Service 里重新查一次状态，见 README 的「已知缺口」
    member-ttl: ${CHARGE_OPS_JWT_MEMBER_TTL:604800000}

    # 前端和后端必须一致，不一致的症状是「登录成功了，但下一个请求 401」
    admin-token-name: token
    member-token-name: authentication

  storage:
    # 目前唯一实现了的是 local（写本地磁盘）。生产用它的前提是有持久化卷，否则容器重启时
    # 上传的图片全部丢失、而数据库里的 URL 还在，历史数据里的图片全是裂的。
    # 换对象存储只需实现一个新的 FileStorage Bean，见 StorageConfiguration
    type: ${CHARGE_OPS_STORAGE_TYPE:local}

    # 生产必须用绝对路径，且落在持久化卷上：相对路径按「项目根目录」锚定（见 LocalFileStorage），
    # 在容器里那个目录通常就是临时层，重启即失
    local-dir: ${CHARGE_OPS_STORAGE_LOCAL_DIR}

    # 这个值会被写进数据库：站点图片列、车主头像列存的是这个前缀拼出来的完整 URL。
    # 所以换域名/上 HTTPS 时光改这里不够，历史数据也得一起刷
    url-prefix: ${CHARGE_OPS_STORAGE_URL_PREFIX}

    # 同时被 LocalFileStorage（拼 URL）和 WebMvcConfiguration（注册静态资源映射）使用，必须一致。
    # 不要配成 /api 开头 —— 那个前缀被 JWT 拦截器盯着，图片会全部裂掉且日志里一条报错都没有
    url-path: /img

springdoc:
  api-docs:
    # 它输出的是一份完整、带参数示例的接口清单，而且 /v3/api-docs 是纯 JSON、不经过我们的
    # JWT 拦截器（挂在 /v3/ 而不是 /api/ 下），是最容易漏掉的未授权暴露
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      # 保持默认的 never：show-details: always 会吐出数据库版本、Redis 版本、磁盘路径，
      # 而 /actuator/health 通常是不认证的（容器探针、外部监控都要打它）。它在 dev 开着。
      # 需要按组件做告警时，正确做法是开 health.probes（liveness/readiness），它只回 UP/DOWN
      show-details: never

# management.endpoints.web.exposure.include 在 application.yml 里，值是 health,info,metrics。
# 生产若要真的开放 metrics 必须先加认证 —— 它能推断出流量规模、接口热度、错误率。

logging:
  # 容器环境下也可以只留 console 交给采集侧，但如果容器没有配日志驱动，日志就真的没了
  file:
    name: ${CHARGE_OPS_LOG_FILE:/var/log/chargeops/chargeops.log}
  level:
    root: info
    # 不要在这里写 com.chargeops: debug。生产要调详情就临时调低某个包的级别 + 滚动重启；
    # 常态开着的话日志量涨一到两个数量级，真正的错误会被冲掉
  pattern:
    # 默认格式没有线程名，而排查 ThreadLocal 串号必须能看到「同一个线程处理了两个请求」
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 值必须显式为 true，理由见 application-dev.yml 里同一段：漏配不会报错，只会让后台任务静默地不跑
chargeops:
  scheduling:
    enabled: true
