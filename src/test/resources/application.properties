# ============================================================================
# 测试环境的两个覆盖
# ============================================================================
# 这个文件的全部作用就是关掉两样「会在测试期间自己动起来」的东西。
# 它不覆盖任何别的配置 —— 连接信息仍然来自 application-dev.yml。
#
# ★ 为什么必须是 .properties 而不是 .yml：
#   两者同名同位置时 Spring Boot 的加载顺序是有讲究的，而这里要的是一个
#   **没有歧义**的覆盖。properties 是这个用途的常规写法。
#
# ★ 这个文件生效于**全部**测试（src/test/resources 无条件在 classpath 上），
#   所以不需要在任何测试类上标注解。

# ---------------------------------------------------------------------------
# 1) 关掉 Flyway
# ---------------------------------------------------------------------------
# 测试库就是开发库，它的表早就建好了，测试也一直假设「表已经在那儿」。
# 让 Flyway 在每次测试上下文启动时去碰这个库有两个问题：
#   · 启动变慢，而且第一次运行会往开发库里写 flyway_schema_history；
#   · 更要紧的是——Flyway 失败 = ApplicationContext 刷新失败 =
#     **所有 @SpringBootTest 类一起挂掉**，看起来像是「整套测试全坏了」，
#     而真正的原因在迁移文件里。
# 迁移本身在「单独启动一次应用」时验证，不在测试里验证。
spring.flyway.enabled=false

# ---------------------------------------------------------------------------
# 2) 关掉定时任务
# ---------------------------------------------------------------------------
# ★★ 这一条不是洁癖，是必需的。★★
#
# @EnableScheduling 在 ChargeOpsApplication 上是开着的，而 @SpringBootTest
# 会加载完整上下文 —— 于是兜底扫描任务会在**全部测试期间**按固定间隔
# 跑起来，把 status=4 的订单翻成 6。而 ChargingOrderServiceImplTest
# 恰恰在断言这些订单的状态。
#
# 结果是「一套平时全绿、偶尔红一项、重跑又好了」的测试 ——
# 也就是最难查的那种失败：它的表现取决于测试跑得够不够慢。
chargeops.scheduling.enabled=false
